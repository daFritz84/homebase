# Authelia configuration — committed (config-as-code, gitops).
# ---
# Secrets are NOT in this file: they are injected from .env.secret via the
# AUTHELIA_* environment variables (see .env.example). Config keys ending in
# secret/password/key/token are picked up from the environment automatically
# (session.secret, storage.encryption_key, identity_providers.oidc.hmac_secret,
# authentication_backend.ldap.password).
#
# The OIDC RSA signing key is read from the gitignored config/keys/oidc.key
# via the `template` config filter (X_AUTHELIA_CONFIG_FILTERS=template in
# compose.yaml) — generate it with the provision script's step 1.
#
# REPLACE_ME markers stay in the committed files — the deployment values are
# secrets and live only on the server:
#   - identity_providers.oidc.clients[homepage|homeassistant|wanderer|cloudflare-access].client_secret
#     (here): the argon2 digest is injected at startup by the `template`
#     filter from the HOMEPAGE_OIDC_CLIENT_SECRET_HASH /
#     HA_OIDC_CLIENT_SECRET_HASH / WANDERER_OIDC_CLIENT_SECRET_HASH /
#     CLOUDFLARE_OIDC_CLIENT_SECRET_HASH env vars (.env.secret, written by
#     provision-authelia-secrets.sh). Indexed env overrides
#     (AUTHELIA_..._CLIENTS_0_...) are NOT supported — 4.39 rejects them with
#     "configuration environment variable not expected". Missing env var ->
#     empty client_secret -> validation fails closed.
#   - {REPLACE_ME} in bootstrap.ldif (two: cn=admin + uid=sseifried): {SSHA}
#     hashes via slappasswd (slapd verifies LDIF passwords; osixia 1.5.0's
#     OpenLDAP 2.4.57 cannot verify argon2) — ./render-ldif.sh fills them
#     from .env.secret into the gitignored config/bootstrap.rendered.ldif
#
# 4.39 schema notes (the plan predates the 4.38 ACL rewrite):
#   - server.trusted_proxies was REMOVED in 4.38 — proxy trust lives in Caddy
#     (forward_auth trusted_proxies); Authelia trusts the proxy network.
#   - access_control rules have no bypass_credentials / user-agent criteria —
#     moot: HA is a native OIDC client (no wall, no bypasses) and the other
#     walled apps (AdGuard, Wanderer) need none.
#   - the OIDC issuer is derived from session.cookies[].authelia_url.
#   - the legacy /api/authelia/validate endpoint is now /api/authz/forward-auth.

server:
  address: 'tcp://:9091/'

log:
  level: 'info'

storage:
  # encryption_key from AUTHELIA_STORAGE_ENCRYPTION_KEY
  local:
    path: '/config/db/authelia.db'

authentication_backend:
  password_reset:
    disable: true # no SMTP — passwords change in bootstrap.ldif (LDIF ritual)
  password_change:
    disable: true
  ldap:
    implementation: 'rfc2307bis' # uid/inetOrgPerson + groupOfNames/member presets
    address: 'ldap://openldap:389'
    base_dn: 'dc=sseifried,dc=link'
    additional_users_dn: 'ou=users'
    additional_groups_dn: 'ou=groups'
    user: 'cn=admin,dc=sseifried,dc=link'
    # password from AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD
    # rfc2307bis preset WITHOUT the preset's trailing !(!pwdReset=TRUE)
    # clause: pwdReset is undefined in osixia 1.5.0's schema set, and the
    # clause then silently excludes EVERY group -> sessions get groups=[]
    # and every subject: group:... rule 403s (verified via slapd access log).
    # 4.39.28 key is groups_filter (NOT group.filter/group_filter) and the
    # user-DN placeholder is {dn} ({user_identifier} is sent literally).
    groups_filter: '(&(|(member={dn})(uniqueMember={dn}))(|(objectClass=groupOfNames)(objectClass=groupOfUniqueNames)(objectClass=groupOfMembers)))'

totp:
  issuer: 'sseifried.link'

webauthn:
  # rp_id is derived from the session cookie domain (sseifried.link)
  display_name: 'Homebase'
  # Bitwarden passkeys self-attest — 'none' avoids indirect-attestation
  # edge cases. The FIDO metadata service stays DISABLED (4.39 default):
  # the Bitwarden AAGUID is not in MDS3, so enabling validate_entry would
  # likely reject registration. prohibit_backup_eligibility must stay
  # false (the default): Bitwarden passkeys are synced inside the vault
  # (backup-eligible) — the mobile Bitwarden app asserts them after sync.
  attestation_conveyance_preference: 'none'

identity_providers:
  oidc:
    # hmac_secret from AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET
    # issuer is derived from session.cookies[].authelia_url below
    jwks:
      - key_id: 'homebase-oidc-rsa'
        algorithm: 'RS256'
        use: 'sig'
        key: |
          {{- fileContent "/config/keys/oidc.key" | nindent 10 }}
    clients:
      - client_id: 'homepage'
        client_name: 'Homepage'
        # argon2 digest injected from .env.secret by the template filter
        # (HOMEPAGE_OIDC_CLIENT_SECRET_HASH, provision-authelia-secrets.sh)
        client_secret: '{{ env "HOMEPAGE_OIDC_CLIENT_SECRET_HASH" }}'
        public: false
        authorization_policy: 'two_factor' # enforced: passkey + TOTP (docs "MFA enrollment")
        consent_mode: 'auto'
        scopes:
          - 'openid'
          - 'email'
          - 'profile'
          - 'offline_access' # required for the refresh_token grant below
        redirect_uris:
          - 'https://homepage.sseifried.link/api/auth/callback/homepage-oidc'
        grant_types:
          - 'authorization_code'
          - 'refresh_token'
        response_types:
          - 'code'
      - client_id: 'homeassistant'
        client_name: 'Home Assistant'
        # argon2 digest injected from .env.secret by the template filter
        # (HA_OIDC_CLIENT_SECRET_HASH, provision-authelia-secrets.sh)
        client_secret: '{{ env "HA_OIDC_CLIENT_SECRET_HASH" }}'
        public: false
        require_pkce: true
        pkce_challenge_method: 'S256'
        authorization_policy: 'two_factor' # enforced: passkey + TOTP (docs "MFA enrollment")
        consent_mode: 'auto'
        scopes: ['openid', 'profile', 'email', 'groups']
        redirect_uris:
          - 'https://homeassistant.sseifried.link/auth/oidc/callback'
        grant_types: ['authorization_code']
        response_types: ['code']
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_post'
      - client_id: 'wanderer'
        client_name: 'Wanderer (PocketBase OIDC SSO)'
        # argon2 digest injected from .env.secret by the template filter
        # (WANDERER_OIDC_CLIENT_SECRET_HASH, provision-authelia-secrets.sh);
        # the RAW secret goes to the PocketBase admin UI (users collection →
        # Options → OAuth2), see docs/services.md "Wanderer SSO"
        client_secret: '{{ env "WANDERER_OIDC_CLIENT_SECRET_HASH" }}'
        public: false
        require_pkce: true
        pkce_challenge_method: 'S256'
        authorization_policy: 'two_factor' # enforced: passkey + TOTP (docs "MFA enrollment")
        consent_mode: 'auto'
        # wanderer requests exactly openid/profile/email
        scopes: ['openid', 'profile', 'email']
        redirect_uris:
          # PocketBase's fixed OIDC callback path: $ORIGIN/login/redirect
          - 'https://wanderer.sseifried.link/login/redirect'
        grant_types: ['authorization_code']
        response_types: ['code']
        # PocketBase authenticates at the token endpoint with POST body
        # credentials (x/oauth2 default)
        token_endpoint_auth_method: 'client_secret_post'
      - client_id: 'cloudflare-access'
        client_name: 'Cloudflare Access'
        # argon2 digest injected from .env.secret by the template filter
        # (CLOUDFLARE_OIDC_CLIENT_SECRET_HASH, provision-authelia-secrets.sh);
        # the RAW secret goes to the Access OIDC IdP form (dashboard)
        client_secret: '{{ env "CLOUDFLARE_OIDC_CLIENT_SECRET_HASH" }}'
        public: false
        require_pkce: true
        pkce_challenge_method: 'S256'
        authorization_policy: 'two_factor' # enforced: passkey + TOTP (docs "MFA enrollment")
        consent_mode: 'auto'
        # the email claim feeds the Access policy email allowlist — the
        # policy email must equal the LDAP `mail` attribute exactly
        scopes: ['openid', 'email', 'profile']
        redirect_uris:
          # Zero Trust team domain (green-mouse-0fd5) — Access redirects the
          # browser here after the Authelia login (federation callback)
          - 'https://green-mouse-0fd5.cloudflareaccess.com/cdn-cgi/access/callback'
        grant_types: ['authorization_code']
        response_types: ['code']
        # Cloudflare Access authenticates at the token endpoint with HTTP
        # Basic (client_secret_basic) — verified via the Authelia log
        # ("request ... using 'client_secret_basic', client configured for
        # 'client_secret_post'"). The homeassistant client keeps post.
        token_endpoint_auth_method: 'client_secret_basic'
        # If the federation test shows Access sends no PKCE, drop require_pkce.

session:
  # secret from AUTHELIA_SESSION_SECRET
  name: 'authelia_session'
  same_site: 'lax'
  expiration: '12h'
  inactivity: '2h'
  cookies:
    - domain: 'sseifried.link'
      authelia_url: 'https://authelia.sseifried.link'
      default_redirection_url: 'https://homepage.sseifried.link'

notifier:
  # no SMTP (LAN-only, no mail server) — filesystem provider is the
  # documented single-provider fallback
  filesystem:
    filename: '/config/notifier/notification.txt'

regulation:
  modes:
    - 'user'
    - 'ip'
  max_retries: 5
  find_time: '2m'
  ban_time: '5m'

access_control:
  default_policy: 'deny'
  # No `networks` definitions: they are only consumed by the `networks`
  # criteria of rules, and no rule references one — LAN-only exposure is
  # enforced by AdGuard split DNS + the VPN, not by Authelia policy.
  # No bypass rules for authelia./homepage./homeassistant.: rules are only
  # evaluated for forward-auth requests, and no Caddy site block forward-auths
  # those domains (authelia serves its own portal — its endpoints are exempt
  # from ACL; Homepage and Home Assistant are native OIDC clients, gated by
  # their clients' authorization_policy + the app-side role checks).
  rules:
    # walled apps. two_factor ENFORCED: Bitwarden passkey (primary) + TOTP
    # (backup) — with zero registered methods the login's 2FA step presents
    # the registration prompt (docs/services.md "MFA enrollment"; recovery:
    # docs/operations.md "Authelia MFA recovery").
    - domain: 'adguard.sseifried.link'
      policy: 'two_factor'
      subject: 'group:homebase-admins'
    # Wanderer is the one app published to the internet via the Cloudflare
    # Tunnel (cloudflared/config.yml); admins-only since the partner
    # account was removed (2026-11-08, stack is single-user).
    - domain: 'wanderer.sseifried.link'
      policy: 'two_factor'
      subject: 'group:homebase-admins'
    # cockpit.sseifried.link: NO rule — the site has no forward_auth, Caddy
    # proxies it directly (PAM + TOTP), default-deny never applies
