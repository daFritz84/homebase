#!/usr/bin/env bash
# Retention/cleanup knobs for the offsite backup pipeline — sourced by
# run-weekly-backups.sh, run-verify.sh and export-backup-stats.sh.
# Non-secret: the secrets (restic repo key + Storage Share app token) live in
# backup/.env.secret (gitignored, 0600, provision-backup-secrets.sh).
#
# Retention contract (docs/operations.md, "Backups"): RPO 7 d, point-in-time
# recovery ~6 months (~11 snapshots), repo budget 5 GB (Storage Share quota is
# UNLIMITED — OCS free/total = -3; the 1 TB plan is the real ceiling, the repo
# budget alert is the capacity tripwire).
# Growth drivers (wanderer GPX, bookorbit covers, stirling storage, HA
# .storage/) are monotonic; dedup + prune bound the repo at ~baseline +
# ~26 weeks of deltas.

# Offsite retention (restic forget, weekly — metadata-only, cheap).
# --keep-last 2 guards GFS edges when the timer fires late.
RESTIC_KEEP_FLAGS="--keep-weekly 5 --keep-monthly 6 --keep-last 2"

# Local archives kept per service, pruned ONLY after a verified upload
# (restic backup + check succeeded). 4 weekly runs ~ 1 month on-host.
LOCAL_KEEP=4

# Quota contract for the Hetzner Storage Share (1 TB plan; quota reported
# UNLIMITED via OCS, free/total = -3 sentinel, so the available-based rules
# below stay silent by design — the >= 0 gate — and fire only if the quota ever
# becomes finite). The vmalert rules in monitoring/vmalert/rules/backup.yml
# carry the matching thresholds (keep in sync when changing these). The Grafana
# quota panel shows used bytes vs the 1 TB plan.
REPO_BUDGET_GB=5
QUOTA_WARN_GB=20
QUOTA_CRIT_GB=5

# Service dir : archive prefix — the SINGLE source of truth for
# run-weekly-backups.sh (archive + local prune) and export-backup-stats.sh
# (per-service staleness metrics). Register a new service in this list only;
# drift means a service silently loses its BackupStale coverage.
SERVICES=(
  "authelia:authelia"
  "wanderer:wanderer-data"
  "navidrome:navidrome-data"
  "jellyfin:jellyfin-data"
  "stirling-pdf:stirling-pdf-data"
  "bookorbit:bookorbit-data"
  "homeassistant:ha-config"
  "rustdesk:rustdesk-data"
  "monitoring:grafana-data"
)
