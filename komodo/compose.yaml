# 🦎 Komodo
# ---
# Secrets are plain env vars from .env.secret (gitignored, 0600, provisioned
# by provision-komodo-secrets.sh) — no _FILE mounts, no uid/gid mapping issues.

services:
  mongo:
    image: mongo:9.0.4
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    networks:
      - komodo-internal-network
    # ports:
    #   - 27017:27017
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    env_file:
      - ${COMPOSE_PROJECT_DIR}/.env
      - ${COMPOSE_PROJECT_DIR}/.env.secret
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.4
    init: true
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    networks:
      caddy-proxy:
          aliases:
            - komodo
      komodo-internal-network: {}
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ${COMPOSE_PROJECT_DIR}/.env
      - ${COMPOSE_PROJECT_DIR}/.env.secret
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
    volumes:
      ## Store dated backups of the database - https://komo.do/docs/setup/backup
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
      - komodo-keys:/config/keys
    deploy:
      resources:
        limits:
          memory: 2g

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.4
    init: true
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    networks:
      - komodo-internal-network
    env_file:
      - ${COMPOSE_PROJECT_DIR}/.env
      - ${COMPOSE_PROJECT_DIR}/.env.secret
    volumes:
      # ✅ Map the **rootless** Podman socket:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock

      ## Allow Periphery to see processes outside of container
      - /proc:/proc:ro
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY}:${PERIPHERY_ROOT_DIRECTORY}:Z
      - komodo-keys:/config/keys
    deploy:
      resources:
        limits:
          memory: 2g

networks:
  caddy-proxy:
    external: true

  komodo-internal-network:
    name: komodo-internal-network
    driver: bridge

volumes:
  # Mongo
  mongo-data:
  mongo-config:
  komodo-keys:
