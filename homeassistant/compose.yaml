# Home Assistant Container (https://www.home-assistant.io/)
# ---
# network_mode: host — REQUIRED for local device discovery (mDNS/SSDP/UPnP,
# HomeKit, inbound integrations). Same pattern as adguard-home: Caddy reaches
# it via the hardcoded host IP (192.168.178.249:8123), LAN clients reach it
# only through Caddy (no firewalld rule for :8123 — by design).
# No env_file: TZ is inline, so `docker compose config` passes in CI untouched.
# Runs as a podman-compose@homeassistant systemd user unit (shared pattern,
# docs/services.md) — started by linger at boot, controlled via systemctl --user.
# HA runs as root in the container; rootless Podman maps it to the host user,
# so a host-user-owned config/ is writable — no `podman unshare chown` needed.

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    environment:
      TZ: Europe/Vienna
    network_mode: host
    volumes:
      - ./config:/config
    healthcheck:
      # HA 2026.10 has no /api/ping (404); "/" returns 200 once the frontend
      # serves. Use CMD-SHELL with a double-quoted python -c: podman-compose
      # runs the healthcheck through /bin/sh, and the exec-form list's
      # parentheses break sh ("unexpected word"). The HA image ships python3
      # (no curl).
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8123/').status==200 else 1)\""]
      interval: 15s
      retries: 10
      start_period: 60s # first start initializes .storage — be generous
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 2g
