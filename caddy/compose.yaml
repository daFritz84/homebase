services:
  caddy:
    container_name: caddy
    build:
      context: .
      dockerfile: Dockerfile
    image: homebase-caddy:2.11.7
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Pin the host-loopback relay explicitly: podman does NOT add
    # host.containers.internal to /etc/hosts for containers on user-defined
    # networks, and aardvark answers NXDOMAIN for it — the name then leaks to
    # upstream DNS where the Fritzbox wildcard-answers with our public IPv6
    # (works only while that prefix is current -> flaky 502s after reboots).
    # 169.254.1.2 is pasta's --map-guest-addr in the rootless netns, relayed
    # to the host loopback (see Caddyfile "AdGuard pattern" comments).
    extra_hosts:
      - "host.containers.internal:169.254.1.2"
    networks:
      - caddy-proxy

networks:
  caddy-proxy:
    external: true

volumes:
  caddy_data:
  caddy_config:
