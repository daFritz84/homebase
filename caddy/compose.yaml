services:
  caddy:
    container_name: caddy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CB_VERSION: 2.11.7
    image: homebase-caddy:2.11.7
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy-proxy

networks:
  caddy-proxy:
    external: true

volumes:
  caddy_data:
  caddy_config: