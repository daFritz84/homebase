# Home Assistant base config. UI-managed state lives in .storage/ (gitignored);
# put credentials in secrets.yaml (gitignored) and reference via !secret.
default_config:

homeassistant:
  external_url: https://homeassistant.sseifried.link
  internal_url: http://192.168.178.249:8123

http:
  # HA is network_mode: host, and Caddy reaches it via the hardcoded host IP
  # (192.168.178.249:8123), so HA sees the proxy source as the host IP — NOT the
  # caddy-proxy bridge subnet. trusted_proxies must list that host IP, otherwise
  # login through Caddy fails with "request from a reverse proxy ... not set-up
  # for reverse proxies". (The bridge-subnet value 10.89.0.0/24 is moot here.)
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.178.249
