---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
#
# Container stats: server: homebase-podman (docker.yaml) + container name
# (podman-compose names: <project>_<service>_<n>, underscores), showStats: true.
- Homebase:
    - Cockpit:
        icon: cockpit
        href: https://cockpit.sseifried.link
        description: Web management — systemd units, logs, containers

    - AdGuard Home:
        icon: adguard-home
        href: https://adguard.sseifried.link
        description: Network-wide DNS & ad blocking
        server: homebase-podman
        container: adguard-home_adguard-home_1
        showStats: true

        widgets:
          - type: adguard
            url: http://192.168.178.249:8095
            username: {{HOMEPAGE_VAR_ADGUARD_USER}}
            password: {{HOMEPAGE_VAR_ADGUARD_PASS}}

    - Wanderer:
        icon: /icons/wanderer.png
        href: https://wanderer.sseifried.link
        description: Self-hosted trail database
        server: homebase-podman
        container: wanderer_web_1
        showStats: true

    - Home Assistant:
        icon: homeassistant
        href: https://homeassistant.sseifried.link
        description: Home automation
        server: homebase-podman
        container: homeassistant_homeassistant_1
        showStats: true
