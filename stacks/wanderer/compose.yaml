# wanderer — self-hosted trail database (https://github.com/open-wanderer/wanderer)
# ---
# Secrets come from .env.secret (gitignored, 0600, provisioned by
# provision-wanderer-secrets.sh) via env_file — no ${VAR:?} interpolation, so
# `docker compose config` passes with a touched .env.secret (CI).
# Topology: only web joins caddy-proxy (alias `wanderer`); db and search stay
# on the internal network. No host ports — access is via Caddy only.

services:
  search:
    # data.ms format is NOT forward-compatible: merging a bump requires wiping
    # data/data.ms (index is rebuildable from PocketBase) or a dump/restore
    # migration — see docs/services.md.
    image: getmeili/meilisearch:v1.55.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    env_file: .env.secret
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./data/data.ms:/meili_data/data.ms
    networks:
      - wanderer-internal
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:7700/health"]
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 1g

  db:
    image: flomp/wanderer-db:v0.21.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    env_file: .env.secret
    environment:
      # Image default is localhost:7700 — point it at the search service.
      MEILI_URL: http://search:7700
      ORIGIN: https://wanderer.sseifried.link
    volumes:
      - ./data/pb_data:/pb_data
      - ./data/plugins:/data/plugins
    networks:
      - wanderer-internal
    depends_on:
      search:
        condition: service_healthy
    healthcheck:
      # /curl is a static binary shipped in the wanderer-db image.
      test: ["CMD", "/curl", "--fail", "http://localhost:8090/health"]
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 512m

  web:
    image: flomp/wanderer-web:v0.21.2
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    env_file: .env.secret
    environment:
      # Must match the public URL Caddy serves, or the app hits CORS errors.
      ORIGIN: https://wanderer.sseifried.link
      MEILI_URL: http://search:7700
      PUBLIC_POCKETBASE_URL: http://db:8090
      UPLOAD_FOLDER: /app/uploads
      BODY_SIZE_LIMIT: "2G"
      PUBLIC_PRIVATE_INSTANCE: "true"
      # Signup enabled by design (private instance: accounts only see their own
      # trails). Set to "true" to close registration (see docs/services.md).
      PUBLIC_DISABLE_SIGNUP: "false"
    volumes:
      - ./data/uploads:/app/uploads
    networks:
      wanderer-internal: {}
      caddy-proxy:
        aliases:
          - wanderer
    depends_on:
      search:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/"]
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s
    deploy:
      resources:
        limits:
          memory: 512m

networks:
  caddy-proxy:
    external: true

  wanderer-internal:
    name: wanderer-internal
    driver: bridge
