services:
  adguard-home:
    image: adguard/adguardhome:latest
    command:
      - '--no-check-update'
      - '-c'
      - /opt/adguardhome/conf/AdGuardHome.yaml
      - '-w'
      - /opt/adguardhome/work
      - '--web-addr'
      - 0.0.0.0:8095
    restart: unless-stopped
    volumes:
      - ./work:/opt/adguardhome/work
      - ./config:/opt/adguardhome/conf
    network_mode: host
