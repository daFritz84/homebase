services:
  adguard-home:
    image: adguard/adguardhome:v0.107.79
    command:
      - '--no-check-update'
      - '-c'
      - /opt/adguardhome/conf/AdGuardHome.yaml
      - '-w'
      - /opt/adguardhome/work
      - '--web-addr'
      - 0.0.0.0:8095
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    deploy:
      resources:
        limits:
          memory: 512m
    volumes:
      - ./work:/opt/adguardhome/work
      - ./config:/opt/adguardhome/conf
    network_mode: host
