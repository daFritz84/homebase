# rustdesk — self-hosted remote-desktop ID/rendezvous (hbbs) + relay (hbbr)
# (https://github.com/rustdesk/rustdesk-server) + tailscale subnet-router sidecar
# ---
# VPN/tailnet-only remote support (user decision 2026-11-14): controlled machines live
# on the LAN; the controlling client reaches the server over the tailnet (tailscale
# sidecar, primary) or the Fritz!Box WireGuard VPN (break-glass). No public exposure:
# rustdesk has NO *.sseifried.link hostname (it is not HTTP, nothing is proxied) —
# never create one, never add anything to cloudflared/config.yml (admin-tool doctrine).
# Ports (verified against rustdesk-server/docs/environment-variables.md):
#   21116/tcp+udp = hbbs ID server (registration, hole punching) — published
#   21117/tcp     = hbbr relay — published
#   21115/tcp     = hbbs NAT-type test + RAW-TCP runtime console (NOT HTTP) —
#                   127.0.0.1 only; access from the SERVER HOST (the image has no
#                   shell, so podman exec is impossible): `printf <cmd> | nc -q1
#                   127.0.0.1 21115` (host nc probed 2026-11-15; the "web console"
#                   is a Server Pro feature — OSS has no HTTP console, decision
#                   revision 2026-11-15)
#   21118/21119   = web-client WebSocket ports — NOT published (web client out of
#                   scope; upstream install docs: keep them closed)
# NO caddy-proxy network: nothing is proxied by service name.
# ./data holds id_ed25519 (PRIVATE key), id_ed25519.pub (the client-config key),
# db_v2.sqlite3 (client ID registry) and tailscale/ (node-key state) — gitignored,
# covered by backup-rustdesk-data.sh.
# Ownership: probed 2026-11-15 on the server (`podman image inspect <image>
# --format '{{.Config.User}}'` — repo doctrine, stirling/uptime-kuma precedent):
# empty (root) for both images -> rootless Podman maps container root to host chef
# -> ./data is host-user-owned, NO chown ritual.
# working_dir: /data is REQUIRED — probed 2026-11-15: the image's WorkingDir is
# /root, so without this the keypair + db_v2.sqlite3 land in the container's
# EPHEMERAL writable layer (lost on recreate = silent keypair rotation + ID
# registry loss; found during first deploy).
# hbbs key: default `-` loads/generates id_ed25519 in the working dir (/data) — no
# `-k` flag needed (docs: "explicitly passing -k _ to hbbs is unnecessary").
# hbbr key: `hbbr -k _` enables relay key validation from the SAME shared ./data
# keypair (docs: empty default "allows clients without a matching key to use the
# relay… choose this tradeoff deliberately"; the s6 image's ENCRYPTED_ONLY=1 does
# exactly this). Clients already present the Key, so validation is free hardening.
# `-r 192.168.178.249:21117` advertises the relay address to clients (LAN-facing
# reference — LAN, VPN and tailnet clients all reach the LAN IP: the tailscale
# sidecar advertises it as a /32 subnet route). Baked at container creation: changing
# it needs `podman-compose up -d --force-recreate`, not a restart.
# Secrets: .env.secret (gitignored, 0600, provision-rustdesk-secrets.sh from Bitwarden
# tailscale-authkey) carries TS_AUTHKEY — CI needs a stub touch (ci.yml).
# NO healthchecks on hbbs/hbbr — PERMANENT (cloudflared/beszel trap: podman-compose
# runs healthchecks as /bin/sh -c). Probed 2026-11-15: the image has NO shell at all
# (`podman run --entrypoint sh` → crun: "executable file `sh` not found" — static
# binary, distroless-style), so no in-container healthcheck of any kind is possible.
# Liveness: the systemd unit + published ports (host-side probes: nc/curl exist).

services:
  hbbs:
    image: docker.io/rustdesk/rustdesk-server:1.1.16
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command: hbbs -r 192.168.178.249:21117
    working_dir: /data
    volumes:
      - ./data:/data
    ports:
      - "21116:21116"
      - "21116:21116/udp"
      - "127.0.0.1:21115:21115"
    deploy:
      resources:
        limits:
          memory: 128m

  hbbr:
    image: docker.io/rustdesk/rustdesk-server:1.1.16
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command: hbbr -k _
    working_dir: /data
    volumes:
      - ./data:/data
    ports:
      - "21117:21117"
    deploy:
      resources:
        limits:
          memory: 128m

  # Tailscale subnet-router sidecar (user decision 2026-11-14): advertises
  # 192.168.178.249/32 (host-only — NOT the LAN /24) so tailnet clients reach the
  # RustDesk ports. TS_USERSPACE=true = userspace networking (the image default): no
  # /dev/net/tun, no NET_ADMIN — the only Tailscale mode that works rootless (rootless
  # Podman cannot grant the TUN device; same constraint class as HA's AF_PACKET
  # limits). TS_ROUTES is the documented container subnet-routing parameter
  # (tailscale.com Docker-params, validated 2026-03-23). TS_AUTH_ONCE=true: state is
  # persisted, so re-auth only when needed (docs: default false forces login every
# start). TS_ENABLE_HEALTH_CHECK (v1.78+): unauthenticated /healthz on
# TS_LOCAL_ADDR_PORT (default [::]:9002) — kept for external probes; the shipped
# healthcheck uses the CLI (no wget in the image, probed 2026-11-15).
  # Traffic path (probed on first run, see docs/services.md): tailnet client ->
  # tailscaled (userspace) -> pod netns default route -> netavark SNAT -> host LAN
  # IP:21116/21117 — lands in the firewalld public zone, where 21116/tcp+udp and
  # 21117/tcp are permanently opened (the documented "bridge -> LAN IP" trap applies
  # only to ports NOT opened there). Subnet routers SNAT by default (Tailscale docs)
  # -> hbbs sees the sidecar's source, not the tailnet client IP (console client list
  # shows one shared source for tailnet clients — expected, not a fault).
  tailscale:
    image: docker.io/tailscale/tailscale:v1.104.7
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    env_file:
      - .env.secret
    environment:
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_ROUTES: "192.168.178.249/32"
      TS_HOSTNAME: "homebase-rustdesk"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_AUTH_ONCE: "true"
      TS_ENABLE_HEALTH_CHECK: "true"
    volumes:
      - ./data/tailscale:/var/lib/tailscale
    # healthcheck: probed 2026-11-15 — the image has /bin/sh (Alpine) but NO
    # wget/nc/curl, so the healthz endpoint is NOT reachable from inside; use the
    # documented CLI signal (tailscale status exits non-zero while the node is
    # logged out / not connected — crash-loop-free: retries 3 tolerate first-auth).
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --peers=false > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
