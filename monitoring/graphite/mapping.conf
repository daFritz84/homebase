---
# graphite-exporter mapping — TrueNAS collectd write_graphite -> Prometheus.
# lite mode: metric name = the graphite path with every non-alphanumeric
# character replaced by "_", value = the last path field, no labels. TrueNAS
# sends "<prefix><host>/<plugin>-<instance>/<type>-<instance>/value" (prefix
# "truenas" set in the TrueNAS UI Graphite export) -> truenas_<host>_..._value.
# No per-metric mappings: the collectd tree is flat and self-describing, and
# lite keeps every metric (pool state, disk temps, SMART, CPU/RAM, network).
defaults:
  lite: true
  include-timestamp: false
mappings: []
