# Alertmanager routing + Telegram receiver. Secrets (bot token, chat id) are
# env-expanded from .env.secret (Alertmanager expands $(VAR) in the config).
# Never put the token/chat id in this committed file.
route:
  receiver: telegram
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="warning"
      receiver: telegram
      repeat_interval: 12h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token: "$(TELEGRAM_BOT_TOKEN)"
        chat_id: $(TELEGRAM_CHAT_ID)
        api_url: https://api.telegram.org
        parse_mode: HTML
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["instance"]
