---
# VictoriaMetrics scrape config (Prometheus-compatible; -promscrape.config).
# Hot-reloaded: VictoriaMetrics re-reads this file on `podman kill -s HUP
# monitoring_victoriametrics_1` (no restart; verified 2026-11-15 — there is no
# automatic timer, the SIGHUP is required after editing this file).
# ---
# The whole monitoring surface is declared here. Adding a service = a target;
# adding a machine = add a node_exporter target (see docs/services.md
# "Monitoring" -> multi-machine).
#
# Endpoint probes go through blackbox-exporter on the INTERNAL caddy-proxy
# alias:port (wall-bypassing, the homepage-widget pattern) — NOT the public
# https:// URL (the Authelia wall returns 302, not 200). Ports verified against
# caddy/Caddyfile upstreams. Per-app path/status behavior from docs/services.md:
# Jellyfin `/` is 302->/web/ (probe /web/), Navidrome `/` is 302->/app/ (probe
# /app/), AdGuard `/` is 302->/login.html (probe /login.html; /health/status is
# 401), Stirling `/` is 302->/login (probe
# /api/v1/info/status), Homepage validates Host (probe /api/healthcheck with the
# http_2xx_homepage module), Cockpit :9090 is HTTPS self-signed + Host-validated
# (tcp_connect only). No ICMP (rootless has no CAP_NET_RAW).

global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Host resources (CPU/RAM/disk/net) + container stats (the podman-stats
  # textfile collector writes podman_container_* into node_exporter's textfile
  # dir, so they arrive on this same endpoint) + Fritzbox WAN stats (the
  # fritzbox-stats-export timer writes fritzbox_* to the same dir — UPnP SOAP,
  # no exporter, no credentials). Scraped via the host-loopback
  # relay (caddy-proxy cannot resolve `homebase`; the LAN IP lands in the
  # firewalld public zone — the adguard/HA/cockpit pattern).
  - job_name: node
    # node_exporter renders /metrics in ~10s (podman-stats + fritzbox textfile
    # collectors + disk stats), over the 10s global scrape_timeout -> every
    # scrape times out, up=0, TargetMissing fires. Give this job headroom:
    # 30s interval, 20s timeout (timeout <= interval). Host metrics do not
    # need 15s resolution.
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets:
          - host.containers.internal:9100

  # Supermicro BMC (.190, the TrueNAS box's mgmt port) via ipmi-exporter,
  # multi-target pattern (metrics_path /ipmi, NOT /probe). v1.10.1 has no
  # collector_timeout (master-only) — scrape_timeout 30s is the outer bound;
  # collectors run serially, keep the 1m interval. UDP 623 open (probed
  # 2026-11-15); the exporter reaches the LAN directly (caddy-proxy outbound,
  # probed same day).
  - job_name: ipmi
    metrics_path: /ipmi
    params:
      module: [autoconf]
    scrape_interval: 1m
    scrape_timeout: 30s
    static_configs:
      - targets:
          - 192.168.178.190
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: ipmi-exporter:9290

  # TrueNAS SCALE (.58) metrics via graphite-exporter: the NAS's collectd
  # write_graphite plugin PUSHES to carbon :2003 (published to the host),
  # graphite-exporter converts (lite mapping, graphite/mapping.conf) and we
  # scrape :9102. 25.10 REMOVED the built-in /api/v2.0/prometheus endpoint
  # (probed 2026-11-15: 404, plugin absent) — the graphite stream is the
  # supported path. Metric names = graphite path (truenas_<host>_..._value);
  # pool state, disk temps, SMART, CPU/RAM. The TrueNAS REST API key stays
  # for the homepage widget (REST v2.0 compat works: pool/alerts 200).
  - job_name: graphite
    scrape_interval: 30s
    static_configs:
      - targets:
          - graphite-exporter:9102

  # App liveness — HTTP 200 probes via blackbox (internal alias:port).
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://authelia:9091/api/health
          - http://wanderer:3000/
          - http://navidrome:4533/app/
          - http://jellyfin:8096/web/
          - http://stirling:8080/api/v1/info/status
          - http://bookorbit:3000/
          - http://host.containers.internal:8095/login.html
          - http://host.containers.internal:8123/
          - http://grafana:3000/api/health
          - http://victoriametrics:8428/health
          - http://alertmanager:9093/-/healthy
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Homepage validates the Host header (HOMEPAGE_ALLOWED_HOSTS) — a plain-IP
  # probe gets a 400 (the Caddyfile :80 health block is the model: Host
  # homepage.sseifried.link + /api/healthcheck). Dedicated module sets the Host.
  - job_name: blackbox_http_homepage
    metrics_path: /probe
    params:
      module: [http_2xx_homepage]
    static_configs:
      - targets:
          - http://homepage:3000/api/healthcheck
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Non-HTTP / host-published liveness — TCP connect. RustDesk hbbs/hbbr
  # (published 0.0.0.0 by podman; reach host.containers.internal — MUST be
  # probed, the Kuma note shows :22 is NOT reachable this way), Caddy's pinned
  # caddy-proxy IP:443, Cockpit :9090 (HTTPS self-signed + Host-validated ->
  # port liveness only).
  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      # Network devices (LAN IPs; caddy-proxy outbound probed 2026-11-15):
      # Fritzbox :49000 (404 on / = open, UPnP/TR-064 port), TrueNAS :443
      # (middleware API), BMC :623 (IPMI; TCP side — UDP 623 probed from the
      # host, blackbox has no UDP module).
      - targets:
          - host.containers.internal:21116
          - host.containers.internal:21117
          - 10.89.0.200:443
          - host.containers.internal:9090
          - 192.168.178.1:49000
          - 192.168.178.58:443
          - 192.168.178.190:623
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Self-monitoring: the monitoring stack's own metrics.
  - job_name: self
    static_configs:
      - targets:
          - victoriametrics:8428
          - grafana:3000
          - alertmanager:9093
          - blackbox:9115
          - vmalert:8880
