---
# monitoring — GitOps observability stack (replaces Uptime Kuma + Beszel)
# ---
# Declarative, git-versioned monitoring: every definition (scrape targets, probe
# modules, alert rules, Grafana dashboards/datasources, alertmanager routing) is
# a YAML/JSON file in this directory, hot-reloaded — no SQLite/PocketBase
# reconcile shim (the reason Kuma/Beszel were retired: their config lives in a
# DB with no config-file model).
#
# Components (this pod, unit `podman-compose@monitoring`):
#   victoriametrics  TSDB + Prometheus-compatible scrape (-promscrape.config)
#   vmalert          evaluates vmalert/rules/*.yml -> Alertmanager
#   grafana          dashboards (provisioning/ + dashboards/ in git), native
#                    Authelia OIDC client (the beszel/jellyfin/stirling pattern)
#   alertmanager     routing + Telegram receiver
#   blackbox-exporter endpoint probes (http_2xx / http_2xx_homepage / tcp)
#   ipmi-exporter        Supermicro BMC (.190) sensors via IPMI LANplus
#                        (docker.io image bundling FreeIPMI; config file with
#                        the BMC auth is gitignored, rendered by the provision
#                        script — no env_file)
#   graphite-exporter    TrueNAS (.58) collectd stream: carbon :2003 published
#                        to the host (the NAS pushes), Prometheus conversion
#                        on the internal net (25.10 REMOVED the built-in
#                        /api/v2.0/prometheus endpoint — probed 2026-11-15)
#
# NOT in this compose (host processes, systemd user units — the beszel-agent
# model, the clean rootless answer for /proc + the podman socket):
#   node_exporter            host CPU/RAM/disk/net, scraped as
#                         host.containers.internal:9100 (the adguard/HA/cockpit
#                            host-loopback relay pattern — caddy-proxy cannot
#                            resolve `homebase` and the LAN IP lands in the
#                            firewalld public zone). install-node-exporter.sh +
#                            systemd/user/node-exporter.service.
#   podman-stats exporter    container stats via `podman stats --no-stream` fed
#                            to node_exporter's textfile collector
#                            (systemd/user/podman-stats-export.{service,timer}).
#   Container stats via podman-exporter (ghcr.io) is NOT used: the server's
#   egress to the ghcr.io token endpoint is 403-blocked (probed 2026-11-15), and
#   podman's built-in metrics endpoint does not initialize on podman 5.4.2
#   (metrics_enabled not honored — probed 2026-11-15). The textfile path is the
#   working, gitops-native, rootless answer.
#
# Image tags pinned (repo doctrine, beszel:0.21.2 precedent); all verified to
# pull on the server 2026-11-15 (docker.io reachable; ghcr.io token endpoint is
# 403-blocked, so no ghcr images).
#
# Ownership: most images' Config.User is empty (root) -> rootless Podman maps
# container root to host chef (jellyfin/uptime-kuma pattern) -> ./data is
# host-user-owned, NO `podman unshare chown` ritual. Probe at first start
# (repo doctrine): `podman image inspect <image> --format '{{.Config.User}}'`.
# EXCEPTIONS (probed 2026-11-15/18): ipmi-exporter and alertmanager pin
# Config.User=nobody -> they need `user: "0:0"` to write their 0600 config /
# data dir (rootless maps nobody to an unmapped subuid).
#
# Healthchecks: grafana (Alpine) / alertmanager (busybox) / blackbox (busybox)
# ship a shell -> in-container healthcheck OK (probe at first start).
# victoriametrics + vmalert ship DISTROLESS images (no /bin/sh) -> NO container
# healthcheck (the podman-compose CMD-array->CMD-SHELL trap, beszel/rustdesk/
# cloudflared precedent); liveness = systemd unit + scrape `up`.
#
# Secrets: grafana + alertmanager read .env.secret (gitignored, 0600,
# provision-monitoring-secrets.sh from Bitwarden). victoriametrics/vmalert/
# blackbox have NO env_file (config is files; CI needs no stub for them).
# victoriametrics/vmalert/blackbox/grafana/alertmanager all join caddy-proxy;
# the UIs are proxied by Caddy (metrics.->victoriametrics wall, grafana. OIDC,
# alerts.->alertmanager wall); the scrapers (blackbox) are internal-only.
# NEVER add metrics./grafana./alerts. to cloudflared/config.yml (admin-tool
# doctrine — LAN/VPN-only via AdGuard split DNS).

services:
  victoriametrics:
    image: docker.io/victoriametrics/victoria-metrics:v1.156.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command:
      - -promscrape.config=/etc/vm/promscrape.yml
      # NO -rule= flag: VM single-node does NOT evaluate recording rules
      # (flag provided but not defined: -rule — probed on v1.156.0 at deploy
      # 2026-11-18). Recording rules are evaluated by vmalert-recording (see
      # below) via MetricsQL against the datasource and written back to VM.
      - -storageDataPath=/vmdata
      - -retentionPeriod=12
      - -httpListenAddr=:8428
    volumes:
      - ./data/victoriametrics:/vmdata
      - ./vm:/etc/vm:ro
    networks:
      caddy-proxy:
        aliases:
          - victoriametrics
    # NO healthcheck: distroless image (no /bin/sh) — the CMD-array->CMD-SHELL
    # trap (beszel/rustdesk precedent). Liveness = systemd unit + scrape up.
    deploy:
      resources:
        limits:
          memory: 1024m

  vmalert:
    image: docker.io/victoriametrics/vmalert:v1.156.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command:
      - -datasource.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -rule=/etc/vmalert/rules/*.yml
      - -evaluationInterval=30s
      - -httpListenAddr=:8880
    volumes:
      - ./vmalert:/etc/vmalert:ro
    networks:
      caddy-proxy:
        aliases:
          - vmalert
    # NO healthcheck: distroless image (no /bin/sh) — same trap as VM.
    deploy:
      resources:
        limits:
          memory: 256m

  vmalert-recording:
    # VM single-node does NOT evaluate recording rules (no -rule= flag —
    # probed v1.156.0 at deploy 2026-11-18). vmalert evaluates them via
    # MetricsQL against the datasource (so label_set/max()/== bool work) and
    # writes the results back to VM. Dedicated instance (not the alerting
    # vmalert) so the rule file lives in ./vm (the VM config dir) and the
    # alerting vmalert's rule glob stays alerts-only. No -notifier.url:
    # recording rules emit no alerts.
    image: docker.io/victoriametrics/vmalert:v1.156.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command:
      - -datasource.url=http://victoriametrics:8428
      - -remoteWrite.url=http://victoriametrics:8428
      - -rule=/etc/vm/rules.yaml
      - -evaluationInterval=30s
      - -httpListenAddr=:8881
    volumes:
      - ./vm:/etc/vm:ro
    networks:
      caddy-proxy:
        aliases:
          - vmalert-recording
    # NO healthcheck: distroless image (no /bin/sh) — same trap as VM/vmalert.
    deploy:
      resources:
        limits:
          memory: 128m

  grafana:
    image: docker.io/grafana/grafana:13.3.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    env_file:
      - .env.secret
    environment:
      GF_SERVER_ROOT_URL: https://grafana.sseifried.link
      # no telemetry (repo doctrine: SYSTEM_ENABLEANALYTICS=false in stirling)
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # OIDC-only login (user decision 2026-11-19): hide the email/password form,
      # Authelia is the only login. Break-glass: flip to "false" +
      # `podman-compose up -d --force-recreate grafana`, log in with the Bitwarden
      # grafana-admin-password; last resort `grafana cli admin reset-admin-password`
      # (docs/operations.md, "Authelia down"). ALLOW_SIGN_UP stays true: required
      # for OIDC auto-provisioning; DISABLE_SIGNUP_MENU only hides the sign-up UI.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNUP_MENU: "true"
      # native Authelia OIDC (generic_oauth; the Authelia Grafana guide)
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Authelia
      GF_AUTH_GENERIC_OAUTH_CLIENT_NAME: Authelia
      # Authelia enforces PKCE (require_pkce: true, S256) for every client;
      # Grafana's generic_oauth sends no code_challenge unless this is on
      # (the deny was "Clients must include a 'code_challenge'..." — 2026-11-15)
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_USERS_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: >-
        https://authelia.sseifried.link/api/oidc/authorization
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: >-
        https://authelia.sseifried.link/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: >-
        https://authelia.sseifried.link/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      # JMESPath role mapping: homebase-admins group -> Grafana Admin
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
        contains(groups, 'homebase-admins') && 'Admin' || 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ROLE_LIST: Admin,Editor,Viewer
      GF_AUTH_GENERIC_OAUTH_TEAM_ROLE: Admin
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      caddy-proxy:
        aliases:
          - grafana
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:3000/api/health >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m

  alertmanager:
    image: docker.io/prom/alertmanager:v0.35.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    # The image pins Config.User=nobody (probed 2026-11-18: id=65534), NOT root
    # — the header's "every image is root" assumption does NOT hold here. Rootless
    # maps nobody to an unmapped subuid, so the chef-owned ./data/alertmanager is
    # unwritable -> "open /alertmanager/nflog...: permission denied" + the same
    # for silences (observed in logs 2026-11-18): silences + notification-log
    # persistence break. Override to container root = host chef (ipmi-exporter
    # precedent).
    user: "0:0"
    env_file:
      - .env.secret
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ./data/alertmanager:/alertmanager
    networks:
      caddy-proxy:
        aliases:
          - alertmanager
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:9093/-/healthy >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m

  ipmi-exporter:
    # Supermicro BMC (.190) sensor metrics via IPMI LANplus (multi-target
    # pattern: /ipmi?target=&module=autoconf). docker.io image (ghcr is
    # 403-blocked); it BUNDLES the FreeIPMI suite (ipmi-sensors, bmc-info,
    # ipmi-dcmi, ipmi-raw, ipmi-sel, ipmi-chassis) — the static binary needs
    # those host packages (apt+sudo), the container does not (verified
    # 2026-11-15). Remote (lanplus) scraping needs no root (the root
    # requirement is for host-local IPMI only).
    image: docker.io/prometheuscommunity/ipmi-exporter:v1.10.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    # The image pins Config.User=nobody (probed at first start 2026-11-15) —
    # nobody cannot read the 0600 rendered ipmi.yml (rootless maps container
    # root to chef, nobody to an unmapped subuid). Override to container root
    # = host chef: the repo's ownership model, the minimal fix.
    user: "0:0"
    command:
      - --config.file=/etc/ipmi/ipmi.yml
    volumes:
      # ipmi.yml carries the BMC credentials -> gitignored, 0600, rendered by
      # provision-monitoring-secrets.sh from Bitwarden `bmc-ipmi` (template:
      # ipmi/ipmi.yml.example). NO env_file: the exporter config has no env
      # expansion, so the credentials live in the rendered file, not in
      # .env.secret.
      - ./ipmi:/etc/ipmi:ro
    networks:
      caddy-proxy:
        aliases:
          - ipmi-exporter
    # Alpine-based (FreeIPMI via apk) -> shell + busybox wget present (verified
    # at first start 2026-11-15). Config.User=nobody -> overridden to root=chef
    # (see user: above). Healthcheck hits the landing page, NOT /metrics:
    # /metrics with no target triggers an inband scrape every 30s ->
    # "could not find inband device" log spam (observed at first deploy).
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:9290/ >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m

  graphite-exporter:
    # TrueNAS SCALE (.58) metrics. 25.10 REMOVED the built-in
    # /api/v2.0/prometheus endpoint (probed 2026-11-15: 404, no plugin in the
    # catalog) — collectd's write_graphite plugin is the supported stream:
    # TrueNAS UI System -> Advanced -> Graphite export -> host
    # 192.168.178.249, port 2003, prefix "truenas", no TLS. carbon :2003
    # (tcp+udp) is published to the host because the NAS PUSHES to it; the
    # converted /metrics (:9102) stays internal on caddy-proxy.
    image: docker.io/prom/graphite-exporter:v0.17.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command:
      - --graphite.listen-address=0.0.0.0:2003
      - --web.listen-address=0.0.0.0:9102
      - --graphite.mapping-config=/etc/graphite-exporter/mapping.conf
    volumes:
      # mapping.conf is public (no secrets) -> tracked, world-readable, so the
      # image's pinned Config.User=nobody (probed at first pull 2026-11-15)
      # can read it — no user: override needed (unlike ipmi-exporter's 0600).
      - ./graphite:/etc/graphite-exporter:ro
    ports:
      - "2003:2003/tcp"
      - "2003:2003/udp"
    networks:
      caddy-proxy:
        aliases:
          - graphite-exporter
    # v0.17.0 (non-distroless tag) ships a shell (the -distrolees variant is a
    # separate tag) -> healthcheck OK; landing page, not /metrics (scrape
    # spam, ipmi-exporter precedent).
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:9102/ >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m

  blackbox-exporter:
    image: docker.io/prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox:ro
    networks:
      caddy-proxy:
        aliases:
          - blackbox
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://localhost:9115/-/healthy >/dev/null 2>&1
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  caddy-proxy:
    external: true
