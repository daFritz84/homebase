---
# vmalert rules — self-monitoring of the observability stack.
groups:
  - name: self
    rules:
      - alert: MonitoringComponentDown
        expr: up{job="self"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring component down: {{ $labels.instance }}"
          description: "{{ $labels.instance }} (self) scrape gap 3m"
      - alert: TSDBDiskUsage
        expr: >-
          (node_filesystem_size_bytes{mountpoint="/"}
          - node_filesystem_avail_bytes{mountpoint="/"})
          / node_filesystem_size_bytes{mountpoint="/"} * 100 > 85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "TSDB host disk usage high on {{ $labels.instance }}"
          description: "Root fs > 85% for 15m on {{ $labels.instance }}"
