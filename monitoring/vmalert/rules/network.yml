---
# vmalert rules — network devices (Fritzbox WAN, TrueNAS, Supermicro BMC).
# Metric sources: fritzbox_* (node_exporter textfile, export-fritzbox-stats.sh),
# scale_truenas_* (collectd write_graphite -> graphite-exporter, lite mapping;
# TrueNAS prepends its "scale" product namespace), truenas_pool_status /
# truenas_disk_temperature_celsius (node_exporter textfile,
# export-truenas-stats.sh — the 25.x graphite stream carries neither),
# ipmi_* (ipmi-exporter). Names verified against the live streams at first
# deploy 2026-11-15 (docs/services.md); adjust here if the plugins rename them.
groups:
  - name: network-fritzbox
    rules:
      - alert: FritzboxWanDisconnected
        expr: fritzbox_wan_physical_link_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Fritzbox WAN link down"
          description: "FRITZ!Box physical link has been down for 5m."
      - alert: FritzboxReboot
        expr: fritzbox_wan_uptime_seconds < 600
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Fritzbox rebooted"
          description: "FRITZ!Box WAN uptime < 10m (reboot? {{ $value | printf \"%.0f\" }}s)."
      - alert: FritzboxStatsStale
        expr: time() - fritzbox_exporter_last_scrape_timestamp > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fritzbox UPnP scrape stale"
          description: >-
            fritzbox-stats-export has not produced fresh metrics for 5m —
            UPnP app-access toggles reset by a firmware update?
            (docs/operations.md)
  - name: network-truenas
    rules:
      - alert: TrueNASGraphiteStale
        # fires only when the NAS is supposed to be running (state != 0): a
        # planned shutdown (chassis off -> homebase:truenas_state == 0)
        # legitimately silences the graphite stream, so the alert is
        # suppressed then. absent() is labelless, so match the state's name
        # label with and on(name).
        expr: >-
          absent({__name__=~"scale_truenas_.+"})
          and on(name) (homebase:truenas_state != 0)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "TrueNAS graphite stream stale"
          description: >-
            No scale_truenas_* series for 15m — Graphite export disabled in the
            TrueNAS UI (System -> Advanced), collectd dead, carbon :2003
            blocked, or the firewalld rich rule dropped (docs/services.md).
      - alert: TrueNASPoolNotOnline
        expr: truenas_pool_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TrueNAS pool {{ $labels.name }} state {{ $labels.state }}"
          description: "ZFS pool not ONLINE for 5m (export-truenas-stats.sh)."
      - alert: TrueNASDiskHot
        expr: truenas_disk_temperature_celsius > 60
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "TrueNAS disk {{ $labels.disk }} hot"
          description: >-
            Disk temperature > 60C for 30m ({{ $value | printf "%.0f" }}C) —
            Ultrastar operating spec tops out at 60C; check airflow/fans
            (BMC fan metrics on the BMC row).
      - alert: TrueNASStatsStale
        # suppressed while the NAS is intentionally off (state == 0): the REST
        # scrape legitimately stops on a planned shutdown. Fires when the NAS
        # is supposed to be running (state != 0) and the scrape is stale.
        expr: >-
          (time() - truenas_exporter_last_scrape_timestamp > 300)
          and on(name) (homebase:truenas_state != 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TrueNAS REST scrape stale"
          description: >-
            export-truenas-stats.sh has not produced fresh metrics for 5m —
            API key revoked by an upgrade? (docs/operations.md)
      # NO chassis-off alert (TrueNASUnexpectedPowerLoss removed 2026-11-19):
      # homebase:truenas_state == 0 (probe down + chassis off) is the
      # planned-shutdown state, and a hard power cut leaves the BMC alive on
      # standby power with the chassis off — state 0 cannot distinguish the
      # two, so any chassis-off alert pages on every planned shutdown (the
      # box is powered down regularly). Chassis-off is visible on the homepage
      # card + Grafana "OFFLINE (intended)" stat; real problems still page:
      # TrueNASDown (state -1) below, TrueNASPoolNotOnline (pool damage from a
      # hard shutdown), and the stale alerts' suppression only applies while
      # the chassis is off.
      - alert: TrueNASDown
        # NAS unreachable with the chassis ON (or BMC state unknown):
        # homebase:truenas_state < 0 (use < 0, not == -1 — MetricsQL negative
        # literal). OS crash, boot loop, or NAS network down.
        expr: homebase:truenas_state < 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TrueNAS unreachable (chassis on / BMC state unknown)"
          description: >-
            NAS probe down while the BMC sees the chassis on (or the BMC is
            unreachable) — OS crash, boot loop, or NAS network down.
  - name: network-bmc
    rules:
      - alert: BmcUnreachable
        # ipmi_up is PER-COLLECTOR ({collector="bmc|chassis|dcmi|ipmi|sel"});
        # the dcmi collector session-times-out on this Supermicro BMC, so a
        # bare `ipmi_up == 0` pages on that single collector. Aggregate to
        # "all collectors down for the instance" — the BMC is unreachable
        # only when every collector fails. by(instance) keeps the label for
        # the annotation.
        expr: max(ipmi_up) by (instance) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "BMC {{ $labels.instance }} unreachable"
          description: >-
            ipmi-exporter lanplus scrape failed for 5m on every collector —
            BMC down, IPMI-over-LAN disabled, or user credentials changed
            (docs/operations.md).
      - alert: BmcFanLow
        expr: ipmi_fan_speed_rpm < 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "BMC fan {{ $labels.name }} low"
          description: "Fan < 1000 RPM for 10m on {{ $labels.instance }}."
      - alert: BmcTempHigh
        expr: ipmi_temperature_celsius > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "BMC sensor {{ $labels.name }} hot"
          description: "IPMI temperature sensor > 85C for 10m on {{ $labels.instance }}."
