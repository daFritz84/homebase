---
# vmalert rules — offsite backup freshness + quota (backup.prom textfile,
# docs/operations.md "Backups"). Thresholds mirror backup/backup.conf
# (LOCAL_KEEP/RPO 7 d, repo budget 5 GB, quota 20/5 GB on the 100 GB share).
groups:
  - name: backup
    rules:
      - alert: BackupStale
        expr: >-
          time() - backup_last_success_timestamp_seconds > 8*24*3600
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "Backup stale: {{ $labels.service }}"
          description: "No successful archive for {{ $labels.service }} in 8 d"
      - alert: BackupStaleCritical
        expr: >-
          time() - backup_last_success_timestamp_seconds > 15*24*3600
        for: 6h
        labels:
          severity: critical
        annotations:
          summary: "Backup critically stale: {{ $labels.service }}"
          description: "No successful archive for {{ $labels.service }} in 15 d"
      - alert: BackupJobFailed
        expr: backup_last_run_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Weekly backup run failed on {{ $labels.instance }}"
          description: "backup_last_run_success == 0 (see journalctl --user
            -u backup-all.service)"
      - alert: BackupVerifyStale
        expr: >-
          time() - backup_verify_last_success_timestamp_seconds > 40*24*3600
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "Backup verify stale on {{ $labels.instance }}"
          description: "No monthly prune + full check in 40 d (retention and
            integrity are not being enforced)"
      - alert: NextcloudQuotaLow
        expr: >-
          nextcloud_quota_info == 1
          and nextcloud_quota_available_bytes < 20*1024*1024*1024
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Storage Share quota low on {{ $labels.instance }}"
          description: "quota-available < 20 GB (versions/trashbin bloat?
            repo growth? docs/operations.md \"Backups\")"
      - alert: NextcloudQuotaCritical
        expr: >-
          nextcloud_quota_info == 1
          and nextcloud_quota_available_bytes < 5*1024*1024*1024
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Storage Share quota critical on {{ $labels.instance }}"
          description: "quota-available < 5 GB — uploads will start failing"
      - alert: NextcloudQuotaProbeFailed
        expr: nextcloud_quota_info == 0
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "Storage Share quota probe failed on {{ $labels.instance }}"
          description: "PROPFIND not answering (token expired? WAN down?) —
            the quota alerts are blind until it recovers"
      - alert: ResticRepoBudgetExceeded
        expr: restic_repo_size_bytes > 5*1024*1024*1024
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "Restic repo over budget on {{ $labels.instance }}"
          description: "repo size > 5 GB budget — shorten RESTIC_KEEP_FLAGS
            in backup/backup.conf"
