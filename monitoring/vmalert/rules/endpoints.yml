---
# vmalert rules — endpoint availability (blackbox probes + scrape liveness).
groups:
  - name: endpoints
    rules:
      - alert: EndpointDown
        # TrueNAS is not always-on: while the BMC reports the chassis powered
        # off (homebase:truenas_state == 0, monitoring/vm/rules.yaml) the
        # probe failure is an intentional shutdown — silenced. The probe has
        # no name label, so match on the empty label set (on()). Network-down
        # cases (state -1) keep firing.
        expr: |
          probe_success == 0
          unless on()
            (homebase:truenas_state == 0)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint down: {{ $labels.instance }}"
          description: "Probe of {{ $labels.instance }} failed for 2m."
      - alert: TargetMissing
        expr: up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Target down: {{ $labels.instance }} ({{ $labels.job }})"
          description: "VM scrape failed: {{ $labels.instance }} for 3m"
