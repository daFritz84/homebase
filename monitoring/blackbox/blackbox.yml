---
# blackbox-exporter probe modules. NO icmp module: rootless Podman has no
# CAP_NET_RAW (ICMP -> EPERM) — same reason Kuma had no ping monitors.
# Host liveness uses tcp_connect.
modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
  # Homepage validates the Host header (HOMEPAGE_ALLOWED_HOSTS); plain-IP
  # probes return 400. Send the allowed Host (the Caddyfile :80 health block).
  http_2xx_homepage:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      headers:
        Host: homepage.sseifried.link
  tcp_connect:
    prober: tcp
    timeout: 5s
