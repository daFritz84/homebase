---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/
#
# The host `resources` widget is removed: host CPU/RAM/disk now live in the Beszel
# widget on the Beszel card (services.yaml) — the resources widget read the
# homepage container's cgroup, not the host, so Beszel is the real source.

- search:
    provider: duckduckgo
    target: _blank

- openmeteo:
    label: Vienna
    latitude: 48.1680783
    longitude: 16.3197505
    timezone: Europe/Vienna
    units: metric
    cache: 5
    format:
      maximumFractionDigits: 1
