---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/info-widgets/
#
# The host `resources` widget is removed: host CPU/RAM/disk now live in the
# Grafana overview dashboard (the monitoring stack's node_exporter is the real
# source) — the widget read the homepage container's cgroup, not the host.

# Header = weather right corner: openmeteo (current) + customapi (3-day
# forecast from open-meteo, key-free). customapi renders left-aligned by
# default; custom.js moves it next to the weather (contract:
# .information-widget-customapi -> #information-widgets-right).
- openmeteo:
    label: Vienna
    latitude: 48.1680783
    longitude: 16.3197505
    timezone: Europe/Vienna
    units: metric
    cache: 5
    format:
      maximumFractionDigits: 1

- customapi:
    label: Wien
    icon: mdi-weather-partly-cloudy
    refreshInterval: 3600000
    # yamllint disable-line rule:line-length
    url: "https://api.open-meteo.com/v1/forecast?latitude=48.1680783&longitude=16.3197505&daily=temperature_2m_max,precipitation_probability_max&temperature_unit=celsius&timezone=Europe%2FVienna&forecast_days=3"
    mappings:
      - label: Heute
        field: daily.temperature_2m_max.0
        format: number
        options:
          maximumFractionDigits: 0
        suffix: °
      - label: Morgen
        field: daily.temperature_2m_max.1
        format: number
        options:
          maximumFractionDigits: 0
        suffix: °
      - label: Übermorgen
        field: daily.temperature_2m_max.2
        format: number
        options:
          maximumFractionDigits: 0
        suffix: °
      - label: Regen
        field: daily.precipitation_probability_max.0
        format: number
        options:
          maximumFractionDigits: 0
        suffix: "%"
