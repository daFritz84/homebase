---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/docker/
#
# Podman is supported through its Docker-compatible API, reached read-only via
# the dockerproxy sidecar in compose.yaml (POST=0) on the shared internal
# network — the rootless socket itself is mounted only into the proxy.

homebase-podman:
  host: dockerproxy
  port: 2375
