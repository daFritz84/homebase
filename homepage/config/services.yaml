---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
#
# Metrics/uptime live in the GitOps observability stack (VictoriaMetrics +
# Grafana + blackbox + node_exporter), which replaced Uptime Kuma + Beszel.
# Basic health surfaces here: the grafana widget (committed dashboard panels:
# targets-up / endpoints-up) on the Monitoring card, and the adguard widget on
# the AdGuard card.
#
# Widget URLs are INTERNAL caddy-proxy aliases (grafana:3000), NOT the public
# https:// URLs: the homepage container's DNS is aardvark (it resolves service
# aliases, not *.sseifried.link — the adguard widget already uses
# host.containers.internal), and the forward_auth wall fronts only the public
# hostname, so the internal port bypasses it.

- Homebase:
    - Cockpit:
        icon: cockpit
        href: https://cockpit.sseifried.link
        description: Web management — systemd units, logs, containers

    - AdGuard Home:
        icon: adguard-home
        href: https://adguard.sseifried.link
        description: Network-wide DNS & ad blocking

        widgets:
          - type: adguard
            url: http://host.containers.internal:8095
            username: {{HOMEPAGE_VAR_ADGUARD_USER}}
            password: {{HOMEPAGE_VAR_ADGUARD_PASS}}

    - Wanderer:
        icon: /icons/wanderer.png
        href: https://wanderer.sseifried.link
        description: Self-hosted trail database

    - Navidrome:
        icon: navidrome
        href: https://navidrome.sseifried.link
        description: Personal music streaming (Subsonic API)

    - Jellyfin:
        icon: jellyfin
        href: https://jellyfin.sseifried.link
        description: Media server (movies & TV, VAAPI)

    - Stirling PDF:
        icon: stirling-pdf
        href: https://stirling.sseifried.link
        description: PDF editor & processor (merge, OCR, sign, convert)

    - BookOrbit:
        # no dashboard-icons entry — custom icon, wanderer pattern
        icon: /icons/bookorbit.png
        href: https://bookorbit.sseifried.link
        description: Self-hosted reading space (ebooks, audiobooks, comics)

    - Home Assistant:
        # dashboard-icons filename is hyphenated; bare "homeassistant" 404s
        icon: home-assistant
        href: https://homeassistant.sseifried.link
        description: Home automation

    - Authelia:
        icon: authelia
        href: https://authelia.sseifried.link
        description: SSO — login portal, 2FA enrollment, OIDC

    - Monitoring:
        # abbr (no icon) — avoids a dashboard-icons 404; the GitOps
        # observability stack (VictoriaMetrics + Grafana + blackbox +
        # node_exporter) replaced Uptime Kuma + Beszel.
        abbr: MO
        href: https://grafana.sseifried.link
        description: GitOps observability — endpoints, host & container metrics

        # Homepage v2.8's `grafana` widget is a STATUS widget (admin/stats +
        # alerts endpoints, needs Admin creds) — the v1 panel-stats mode with
        # apiKey/stats was removed, so the fleet-health numbers come straight
        # from VictoriaMetrics (Prometheus-compatible API, internal caddy-proxy
        # alias, no auth, no secret) via the prometheusmetric widget.
        widgets:
          - type: prometheusmetric
            url: http://victoriametrics:8428
            metrics:
              - label: Targets up
                query: count(up == 1)
              - label: Endpoints up
                query: count(probe_success == 1)
              - label: Containers up
                query: count(podman_container_up == 1)
              - label: CPU %
                query: >-
                  100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100
                format:
                  type: number
                  options:
                    maximumFractionDigits: 1

- Network:
    # LAN devices discovered 2026-11-15 (docs/services.md "Network devices").
    # Widget URLs are LAN IPs: the homepage container reaches the LAN via
    # pasta outbound (probed 2026-11-15 — the docs' LAN-IP warning is about
    # inbound hairpin to homebase's own IP, not outbound).

    - FRITZ!Box 7530:
        icon: fritzbox
        href: http://192.168.178.1/
        description: Router — WAN status via UPnP (no credentials)

        # Homepage's fritzbox widget reads UPnP/IGD status (no credentials);
        # needs "Allow access for applications" + "Transmit status information
        # over UPnP" in the Fritzbox UI. Max 4 fields.
        widgets:
          - type: fritzbox
            url: http://192.168.178.1
            fields:
              - uptime
              - externalIPAddress
              - down
              - up

    - TrueNAS SCALE:
        icon: truenas
        href: https://truenas.fritz.box
        description: NAS (Supermicro) — pools, disks, SMART

        widgets:
          - type: truenas
            url: https://192.168.178.58
            # REST API widget mode (version 1) for SCALE 24.10; READONLY API
            # key (Bitwarden truenas-api-key, same key feeds the Prometheus
            # scrape).
            version: 1
            key: {{HOMEPAGE_VAR_TRUENAS_KEY}}
            enablePools: true
            nasType: scale

    - Supermicro BMC:
        # no dashboard-icons entry — abbr card, Monitoring pattern
        abbr: BMC
        href: https://192.168.178.190
        description: IPMI management of the TrueNAS box (sensors via ipmi-exporter)

        # Homepage has no redfish/ipmi widget (checked v2.8 widget list) —
        # the numbers come from VictoriaMetrics (ipmi-exporter metrics), the
        # Monitoring-card pattern, no secret.
        widgets:
          - type: prometheusmetric
            url: http://victoriametrics:8428
            metrics:
              - label: BMC up
                query: ipmi_up
              - label: Max temp
                query: max(ipmi_temperature_celsius)
                format:
                  type: number
                  options:
                    maximumFractionDigits: 1
              - label: Min fan
                query: min(ipmi_fan_speed_rpm)
                format:
                  type: number
                  options:
                    maximumFractionDigits: 0
