---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/
#
# Metrics/uptime moved to Beszel + Uptime Kuma: per-container showStats
# (CPU/RAM) are gone (the dockerproxy sidecar + podman.sock mount are removed).
# Basic health stays here: the uptimekuma widget (status-page aggregate:
# up/down/uptime) on the Uptime Kuma card, the beszel widget (host
# CPU/RAM/disk) on the Beszel card, and the adguard widget on the AdGuard card.
#
# Widget URLs are INTERNAL caddy-proxy aliases (status:3001, beszel:8090), NOT
# the public https:// URLs: the homepage container's DNS is aardvark (it
# resolves service aliases, not *.sseifried.link — the adguard widget already
# uses host.containers.internal), and the forward_auth wall fronts only the
# public hostname, so the internal port bypasses it.

- Homebase:
    - Cockpit:
        icon: cockpit
        href: https://cockpit.sseifried.link
        description: Web management — systemd units, logs, containers

    - AdGuard Home:
        icon: adguard-home
        href: https://adguard.sseifried.link
        description: Network-wide DNS & ad blocking

        widgets:
          - type: adguard
            url: http://host.containers.internal:8095
            username: {{HOMEPAGE_VAR_ADGUARD_USER}}
            password: {{HOMEPAGE_VAR_ADGUARD_PASS}}

    - Wanderer:
        icon: /icons/wanderer.png
        href: https://wanderer.sseifried.link
        description: Self-hosted trail database

    - Navidrome:
        icon: navidrome
        href: https://navidrome.sseifried.link
        description: Personal music streaming (Subsonic API)

    - Jellyfin:
        icon: jellyfin
        href: https://jellyfin.sseifried.link
        description: Media server (movies & TV, VAAPI)

    - Stirling PDF:
        icon: stirling-pdf
        href: https://stirling.sseifried.link
        description: PDF editor & processor (merge, OCR, sign, convert)

    - BookOrbit:
        # no dashboard-icons entry — custom icon, wanderer pattern
        icon: /icons/bookorbit.png
        href: https://bookorbit.sseifried.link
        description: Self-hosted reading space (ebooks, audiobooks, comics)

    - Home Assistant:
        # dashboard-icons filename is hyphenated; bare "homeassistant" 404s
        icon: home-assistant
        href: https://homeassistant.sseifried.link
        description: Home automation

    - Authelia:
        icon: authelia
        href: https://authelia.sseifried.link
        description: SSO — login portal, 2FA enrollment, OIDC

    - Uptime Kuma:
        # abbr (no icon) — avoids a dashboard-icons 404; probe the `uptime-kuma`
        # icon later and swap if present.
        abbr: UK
        href: https://status.sseifried.link
        description: Uptime & availability monitoring

        # The uptimekuma widget has no full API — it reads a STATUS PAGE (create
        # one in Kuma, group the monitored sites, record its slug). It shows the
        # aggregate (up/down/uptime/incident), i.e. fleet-wide basic health.
        widgets:
          - type: uptimekuma
            url: http://status:3001
            slug: {{HOMEPAGE_VAR_KUMA_SLUG}}

    - Beszel:
        abbr: BZ
        href: https://metrics.sseifried.link
        description: Host & container metrics (CPU/RAM/disk)

        # beszel widget: single-system detailed stats (systemId). The hub
        # requires a superuser for API access (username/password, not an API
        # key). version 2 for Beszel >= 0.9.0.
        widgets:
          - type: beszel
            url: http://beszel:8090
            username: {{HOMEPAGE_VAR_BESZEL_USER}}
            password: {{HOMEPAGE_VAR_BESZEL_PASS}}
            systemId: {{HOMEPAGE_VAR_BESZEL_SYSTEMID}}
            version: 2
            fields: [cpu, memory, disk]
