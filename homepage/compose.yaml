services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    # Strict on purpose: a missing .env must fail the start — the widgets need
    # the ADGUARD keys and would silently render degraded otherwise.
    env_file: .env
    volumes:
      - ./config:/app/config
      # Local custom icons: Homepage serves /app/public/icons at /icons/...
      # (the config mount is NOT served) — restart needed after adding files.
      - ./config/icons:/app/public/icons
    networks:
      caddy-proxy:
        aliases:
          - homepage
    deploy:
      resources:
        limits:
          memory: 512m

# No dockerproxy sidecar / podman.sock mount: the per-container showStats that
# fed it are gone (metrics moved to Beszel, uptime to Uptime Kuma), so the
# read-only Docker-API surface is removed entirely. The Beszel agent (a host
# process) reads chef's own podman.sock directly for container stats — no proxy.
# The widgets (uptimekuma, beszel, adguard) reach their backends over the shared
# caddy-proxy network by service alias (status:3001, beszel:8090) — Homepage
# joins caddy-proxy, so no internal network is needed.

networks:
  caddy-proxy:
    external: true
