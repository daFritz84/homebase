services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    # Strict on purpose: a missing .env must fail the start — the widgets need
    # the ADGUARD keys and would silently render degraded otherwise.
    env_file: .env
    volumes:
      - ./config:/app/config
      # Homepage substitutes {{HOMEPAGE_VAR_*}} in the config files from a .env
      # in the CONFIG dir (not the container env) — mount the service-root .env
      # (gitignored, provisioned) in, read-only.
      - ./.env:/app/config/.env:ro
      # Local custom icons: Homepage serves /app/public/icons at /icons/...
      # (the config mount is NOT served) — restart needed after adding files.
      - ./config/icons:/app/public/icons
    networks:
      caddy-proxy:
        aliases:
          - homepage
    deploy:
      resources:
        limits:
          memory: 512m

# No dockerproxy sidecar / podman.sock mount: the per-container showStats that
# fed it are gone (metrics/uptime moved to the monitoring stack), so the
# read-only Docker-API surface is removed entirely. The monitoring host
# processes (node_exporter + the podman-stats exporter) read /proc and chef's
# own podman.sock directly for host + container stats — no proxy.
# The widgets (prometheusmetric -> victoriametrics:8428, adguard) reach their
# backends over the shared caddy-proxy network by service alias — Homepage
# joins caddy-proxy, so no internal network is needed.

networks:
  caddy-proxy:
    external: true
