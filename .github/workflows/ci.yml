name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — gitleaks scans all commits, not just the diff
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        env:
          XDG_RUNTIME_DIR: /tmp # homepage mounts ${XDG_RUNTIME_DIR}/podman/podman.sock
        run: |
          touch caddy/.env homepage/.env wanderer/.env.secret authelia/.env.secret stirling-pdf/.env.secret bookorbit/.env.secret rustdesk/.env.secret monitoring/.env.secret
          # rustdesk needs a stub: env_file .env.secret (TS_AUTHKEY for the
          #   tailscale subnet-router sidecar; the key itself is a Bitwarden
          #   item, the stub is empty)
          # monitoring needs a stub: grafana + alertmanager use env_file
          #   .env.secret (Grafana admin pw + OIDC secret + Telegram token/chat;
          #   the values are Bitwarden items, the stub is empty)
          # cloudflared needs no stub: no env_file (credentials.json is a
          # bind-mount, and volume targets need not exist for `config`)
          # navidrome needs no stub: no env_file (config lives in the image ENV)
          # jellyfin needs no stub: no env_file (config lives in data/jellyfin.xml)
          # uptime-kuma/beszel are retired (replaced by monitoring/)
          for f in caddy adguard-home homeassistant homepage wanderer authelia cloudflared navidrome jellyfin stirling-pdf bookorbit rustdesk monitoring; do
            echo "::group::$f"
            docker compose -f "$f/compose.yaml" config -q
            echo "::endgroup::"
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-shellcheck@v1
        with:
          path: "."
          pattern: "*.sh"

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-yamllint@v1
        with:
          yamllint_flags: "homepage/config/ monitoring/"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: caddy/Dockerfile

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build caddy image (Cloudflare DNS plugin)
        run: docker build -t homebase-caddy caddy
      - name: Validate Caddyfile
        run: |
          token="$(openssl rand -base64 48 | tr -d '=+/' | tr -d '\n' | cut -c1-50)"
          docker run --rm \
            -e ACME_EMAIL=ci@example.com \
            -e ACME_CA=https://acme-v02.api.letsencrypt.org/directory \
            -e CF_API_TOKEN="$token" \
            -v "$PWD/caddy:/etc/caddy:ro" \
            homebase-caddy \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate blackbox config
        run: |
          docker run --rm -v "$PWD/monitoring/blackbox:/c:ro" \
            docker.io/prom/blackbox-exporter:v0.25.0 \
            --config.file=/c/blackbox.yml --config.check
      - name: Validate alertmanager config
        run: |
          docker run --rm -v "$PWD/monitoring/alertmanager:/c:ro" \
            -e TELEGRAM_BOT_TOKEN=ci-dummy \
            --entrypoint amtool docker.io/prom/alertmanager:v0.28.1 \
            check-config /c/alertmanager.yml
      - name: Validate vmalert rules (promtool, Prometheus-compatible)
        run: |
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz -o /tmp/p.tar.gz
          tar -xzf /tmp/p.tar.gz -C /tmp
          /tmp/prometheus-2.53.0.linux-amd64/promtool check rules monitoring/vmalert/rules/*.yml
          # monitoring/vm/rules.yaml is NOT promtool-checked: it uses
          # MetricsQL-only functions (label_set) that the Prometheus parser
          # rejects (promtool: "unknown function with name label_set"). VM
          # evaluates it natively; the expressions are validated live against
          # the VM API (docs/services.md "Network devices"). yamllint covers
          # the file's YAML syntax.
      - name: Validate Grafana dashboard JSON
        run: |
          for f in monitoring/grafana/dashboards/*.json; do
            python3 -c "import json,sys; d=json.load(open('$f')); assert d['uid'] and d['panels'], '$f'"
          done
