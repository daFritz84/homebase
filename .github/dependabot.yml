version: 2
updates:
  # --- Docker Compose (compose.yaml) — all stacks in one weekly PR group ---
  - package-ecosystem: "docker-compose"
    directories:
      - "/stacks/homepage"
      - "/stacks/testweb"
      - "/stacks/wanderer"
      - "/caddy"
      - "/komodo"
      - "/adguard-home"
    schedule:
      interval: "weekly"
    ignore:
      # Meilisearch data.ms is NOT forward-compatible across versions (1.36.0
      # data + 1.55.0 engine = hard crash). Wanderer upstream pins v1.36.0;
      # bump manually only together with a wanderer release, migrating data.ms
      # per https://www.meilisearch.com/docs/learn/update_and_migration/updating
      - dependency-name: "getmeili/meilisearch"
        versions: ["*"]

  # --- Dockerfile base images (caddy builder + runtime; the compose image is a local build) ---
  - package-ecosystem: "docker"
    directory: "/caddy"
    schedule:
      interval: "weekly"

  # --- GitHub Actions refs in .github/workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
