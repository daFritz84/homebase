version: 2
updates:
  # --- Docker Compose (compose.yaml) — all stacks in one weekly PR group ---
  - package-ecosystem: "docker-compose"
    directories:
      - "/stacks/homepage"
      - "/stacks/testweb"
      - "/stacks/wanderer"
      - "/caddy"
      - "/komodo"
      - "/adguard-home"
    schedule:
      interval: "weekly"

  # --- Dockerfile base images (caddy builder + runtime; the compose image is a local build) ---
  - package-ecosystem: "docker"
    directory: "/caddy"
    schedule:
      interval: "weekly"

  # --- GitHub Actions refs in .github/workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
