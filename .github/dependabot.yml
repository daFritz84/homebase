version: 2
updates:
  # --- Docker Compose (compose.yaml) — all services in one weekly PR group ---
  - package-ecosystem: "docker-compose"
    directories:
      - "/homeassistant"
      - "/homepage"
      - "/wanderer"
      - "/caddy"
      - "/adguard-home"
    schedule:
      interval: "weekly"
    # NOTE: merging a getmeili/meilisearch bump requires wiping data/data.ms
    # (index is rebuildable from PocketBase) BEFORE the first start of the new
    # engine — the data format is not forward-compatible. See wanderer/.

  # --- Dockerfile base images (caddy builder + runtime; the compose image is a local build) ---
  - package-ecosystem: "docker"
    directory: "/caddy"
    schedule:
      interval: "weekly"

  # --- GitHub Actions refs in .github/workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
